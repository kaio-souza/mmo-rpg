# fail2ban filter: wrong passwords logged by the gateway.
# Install: cp to /etc/fail2ban/filter.d/ (ops/install.sh does it when
# fail2ban is present). IPv6 lines carry the address too.
[Definition]
failregex = \blogin failed ip=<HOST>\s
            \bwrong current password ip=<HOST>\s
ignoreregex =
journalmatch = _SYSTEMD_UNIT=game.service
