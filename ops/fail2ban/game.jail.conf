# fail2ban jail: an IP with 20 wrong passwords in 10 minutes is
# dropped at the firewall for an hour. The game's own waits still apply
# below this; this only spares the server the work.
# Install: cp to /etc/fail2ban/jail.d/game.conf.
[game-login]
enabled = true
backend = systemd
filter = game-login
port = 7000
protocol = tcp
maxretry = 20
findtime = 10m
bantime = 1h
